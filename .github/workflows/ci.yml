name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet-cqrs-eventsourcing.slnx

      - name: Build
        run: dotnet build dotnet-cqrs-eventsourcing.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test dotnet-cqrs-eventsourcing.slnx --no-build --configuration Release --verbosity normal
